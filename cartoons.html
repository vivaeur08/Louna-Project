<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Louna TV - Streaming</title>
    <style>
        :root {
            --primary: #1a3a16;
            --dark: #0d1f0b;
            --accent: #d4af37;
            --snow: #f8f9fa;
            --shadow: rgba(0, 0, 0, 0.8);
            --seen: #4caf50;
        }

        body { 
            margin: 0;
            background-color: var(--dark);
            background: linear-gradient(to bottom, var(--primary), var(--dark));
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            color: var(--snow);
            overflow-x: hidden;
            padding-bottom: 50px;
        }

        /* --- NAVIGATION --- */
        .nav {
            position: fixed; top: 0; width: 100%; padding: 15px 20px;
            display: flex; justify-content: space-between; align-items: center;
            transition: all 0.5s; z-index: 1000;
            background: linear-gradient(to bottom, rgba(0,0,0,0.7) 0%, rgba(0,0,0,0) 100%);
            box-sizing: border-box;
        }
        .nav.black { background-color: var(--dark); border-bottom: 1px solid rgba(212, 175, 55, 0.1); }
        .nav-logo {
            color: var(--accent); font-size: 1.5rem; font-weight: bold;
            text-shadow: 0px 0px 10px rgba(212, 175, 55, 0.5);
            text-transform: uppercase; letter-spacing: 2px; cursor: pointer;
        }

        .search-box {
            background: rgba(0,0,0,0.5); border: 1px solid var(--accent);
            border-radius: 4px; padding: 5px 10px; display: flex; align-items: center;
        }
        .search-box label { cursor: pointer; font-size: 1.2rem; margin-right: 5px; }
        .search-box input {
            background: transparent; border: none; color: white; padding: 5px;
            outline: none; width: 150px; font-size: 0.9rem;
        }

        /* --- BANNIÈRE --- */
        .banner {
            height: 60vh; background-size: cover; background-position: center center;
            position: relative; color: white; display: flex; flex-direction: column; justify-content: center;
        }
        .banner--fadeBottom {
            position: absolute; bottom: 0; width: 100%; height: 10rem;
            background-image: linear-gradient(180deg, transparent, var(--dark));
        }
        .banner__contents { margin-left: 30px; padding-top: 80px; height: 190px; z-index: 10; }
        .banner__title {
            font-size: 3rem; font-weight: 800; padding-bottom: 0.3rem;
            color: var(--accent); text-shadow: 2px 2px 4px black;
        }
        .banner__description {
            width: 45rem; line-height: 1.3; padding-top: 1rem; font-size: 1rem;
            max-width: 360px; height: 80px; text-shadow: 1px 1px 2px black;
        }
        .banner__button {
            cursor: pointer; color: #fff; outline: none; border: none; font-weight: 700;
            border-radius: 0.2vw; padding: 0.5rem 2rem; margin-right: 1rem;
            background-color: rgba(51, 51, 51, 0.8); transition: all 0.2s;
        }
        .banner__button:hover { color: #000; background-color: var(--accent); }
        .btn-play { background-color: var(--accent); color: black; }

        /* --- ROWS --- */
        .row { margin-left: 20px; margin-top: 20px; }
        .row__title {
            color: var(--snow); font-size: 1.2rem; font-weight: 600; margin-bottom: 10px;
            border-left: 4px solid var(--accent); padding-left: 10px;
        }
        .row__posters {
            display: flex; overflow-y: hidden; overflow-x: scroll; padding: 20px 0; gap: 15px;
        }
        .row__posters::-webkit-scrollbar { display: none; }
        .row__poster {
            max-height: 200px; object-fit: cover; aspect-ratio: 2/3; border-radius: 6px;
            width: 100%; transition: transform 450ms; cursor: pointer;
            border: 1px solid rgba(212, 175, 55, 0.2);
        }
        .row__poster:hover {
            transform: scale(1.08); border-color: var(--accent);
            box-shadow: 0 0 15px rgba(212, 175, 55, 0.4);
        }
        .poster-container { position: relative; flex: 0 0 auto; }
        .fav-badge { 
            position: absolute; top: 5px; right: 15px; background: rgba(0,0,0,0.6); 
            border-radius: 50%; width: 25px; height: 25px; display: flex; 
            align-items: center; justify-content: center; z-index: 5; color: rgba(255,255,255,0.5); 
            cursor: pointer; font-size: 0.8rem; border: 1px solid transparent;
        }
        .fav-badge.active { color: #ff4d6d; border-color: #ff4d6d; background: rgba(0,0,0,0.8); }

        /* --- MODAL --- */
        .modal-episodes { 
            position: fixed; inset: 0; background: rgba(13, 31, 11, 0.95); 
            display: none; flex-direction: column; padding: 20px; z-index: 2000; 
            backdrop-filter: blur(5px);
        }
        .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        
        .episode-row { 
            background: rgba(255, 255, 255, 0.05); 
            border-left: 3px solid transparent;
            margin: 8px 0; padding: 15px; border-radius: 4px; color: white; 
            display: flex; align-items: center; justify-content: space-between;
            cursor: pointer; transition: 0.3s;
        }
        .episode-row:hover { background: rgba(212, 175, 55, 0.2); border-left: 3px solid var(--accent); }
        .episode-row.seen { color: #81c784; }
        .episode-row.current { border-left: 3px solid var(--seen); background: rgba(76, 175, 80, 0.1); font-weight: bold; color: var(--seen); }
        .seen-icon { font-size: 1.2rem; margin-left: 10px; }

        .video-wrapper {
            position: relative; padding-bottom: 56.25%; height: 0; 
            overflow: hidden; border-radius: 8px; border: 1px solid var(--accent);
            background: #000; box-shadow: 0 0 20px rgba(0,0,0,0.8);
            margin-bottom: 15px;
        }
        .video-wrapper iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; }
        
        /* Bouton France TV spécifique */
        #lolirock-francetv-btn {
            background: #e2001a;
            color: white;
            font-weight: bold;
            border: none;
            padding: 8px 15px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 0.9rem;
            display: none; /* Contrôlé par JS */
            margin-right: 15px;
        }

        .player-controls {
            display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;
        }
        .btn-control {
            background: var(--accent); border: none; padding: 10px 20px; 
            border-radius: 4px; font-weight: bold; cursor: pointer;
            font-size: 1rem; color: #0d1f0b;
        }
        .fullscreen-btn {
            position: absolute; top: 10px; right: 10px; z-index: 20;
            background: rgba(212, 175, 55, 0.9); border: none; padding: 5px 10px;
            border-radius: 5px; cursor: pointer;
        }

        /* --- MESSAGES --- */
        .falling-item { position: fixed; top: -50px; z-index: 9999; pointer-events: none; animation: fall linear forwards; }
        @keyframes fall { to { transform: translateY(110vh) rotate(360deg); } }

        #christmas-msg, #finish-msg {
            position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
            background: rgba(26, 58, 22, 0.95); color: var(--accent);
            padding: 40px; border-radius: 10px; border: 2px solid var(--accent);
            text-align: center; z-index: 10000; font-size: 2rem; display: none;
        }

        @media (max-width: 600px) {
            .banner__title { font-size: 2rem; }
            .banner__description { display: none; }
            #lolirock-francetv-btn { font-size: 0.7rem; padding: 5px 10px; }
        }
        /* --- ANIMATIONS EASTER EGGS --- */
.falling-item {
    position: fixed;
    top: -50px;
    z-index: 9999;
    pointer-events: none;
    animation: fall linear forwards;
}

@keyframes fall {
    to {
        transform: translateY(110vh) rotate(360deg);
    }
}

#christmas-msg, #finish-msg {
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    background: rgba(26, 58, 22, 0.95);
    color: var(--accent);
    padding: 40px;
    border-radius: 10px;
    border: 2px solid var(--accent);
    text-align: center;
    z-index: 10000;
    font-size: 2rem;
    display: none;
    box-shadow: 0 0 50px rgba(212, 175, 55, 0.3);
}

/* Badge qui s'affiche sur l'image au menu */
.progress-badge {
    position: absolute;
    bottom: 8px;
    right: 8px;
    background: var(--seen);
    color: white;
    font-size: 0.7rem;
    padding: 3px 8px;
    border-radius: 10px;
    font-weight: bold;
    box-shadow: 0 2px 5px rgba(0,0,0,0.5);
    z-index: 10;
}

/* Style spécial pour les épisodes dans la liste */
.episode-row.current {
    border-left: 4px solid var(--accent) !important;
    background: rgba(212, 175, 55, 0.15) !important;
    font-weight: bold;
}
.episode-row.seen {
    opacity: 0.6;
}

    </style>

    </div>

        { n: "S3 - La Mouette", id: "GcIh1l1R17g" },
        { n: "S3 - Le Requin", id: "Yo8EkTqwgB0" },
        { n: "S3 - La Caravane", id: "o8pUkQE66PM" },
        { n: "S3 - Le Gorille", id: "rknqMGECfb4" },
        { n: "S3 - La Chouette", id: "qRC44dLgRFU" },
        { n: "S3 - Le Morse", id: "JpC1I98yWpw" },
        { n: "S3 - L'Âne", id: "zRvVMW8xwvc" }
    ]
},
    ];

    let favs = JSON.parse(localStorage.getItem('louna_tv_favs')) || [];
    let progress = JSON.parse(localStorage.getItem('louna_tv_progress')) || {}; 
    let rainInterval = null;

    window.onload = () => { initHero(); render(); };

    function initHero() {
        const c = cartoons[Math.floor(Math.random() * cartoons.length)];
        document.getElementById('hero-banner').style.backgroundImage = `url('${c.img}')`;
        document.getElementById('hero-title').innerText = c.title;
    }
function render() {
    const scrollAll = document.getElementById('scroll-all');
    const scrollFavs = document.getElementById('scroll-favs');
    const scrollReplay = document.getElementById('scroll-replay'); // Cette section servira pour "En cours"
    
    scrollAll.innerHTML = ''; 
    scrollFavs.innerHTML = ''; 
    scrollReplay.innerHTML = '';
    
    let hasProgress = false;

    cartoons.forEach((c, index) => {
        // Calcul de la progression
        const lastIdx = progress[c.title];
        const isStarted = lastIdx !== undefined;
        const isFinished = lastIdx >= c.episodes.length - 1;

        // Création de la carte avec le badge
        let badge = "";
        if (isStarted && !isFinished) {
            badge = `<div class="progress-badge">Ép. ${lastIdx + 1}</div>`;
        } else if (isFinished) {
            badge = `<div class="progress-badge" style="background:var(--accent)">Fini ✓</div>`;
        }

        const card = `
            <div class="poster-container">
                <div class="fav-badge ${favs.includes(c.title) ? 'active' : ''}" onclick="toggleFav('${c.title}')">❤</div>
                ${badge}
                <img class="row__poster" src="${c.img}" alt="${c.title}" onclick="openModal(${index})">
            </div>
        `;

        // Affichage dans "Tous"
        scrollAll.innerHTML += card;

        // Affichage dans "Favoris"
        if (favs.includes(c.title)) scrollFavs.innerHTML += card;

        // Affichage dans "En cours" (Si commencé mais pas fini)
        if (isStarted && !isFinished) {
            scrollReplay.innerHTML += card;
            hasProgress = true;
        }
    });

    // Afficher ou cacher les sections
    document.getElementById('section-favs').style.display = favs.length > 0 ? 'block' : 'none';
    
    // On utilise la section replay pour afficher les progrès
    const sectionReplay = scrollReplay.parentElement; 
    sectionReplay.querySelector('.row__title').innerText = "🕒 Continuer à regarder";
    sectionReplay.style.display = hasProgress ? 'block' : 'none';
}

    function toggleFav(t) {
        favs = favs.includes(t) ? favs.filter(x => x !== t) : [...favs, t];
        localStorage.setItem('louna_tv_favs', JSON.stringify(favs));
        render();
    }

    function openModal(idx) {
        const c = cartoons[idx];
        const btnFTV = document.getElementById("lolirock-francetv-btn");
        btnFTV.style.display = (c.title === "LoliRock") ? "inline-block" : "none";

        document.getElementById('modal-title').innerText = c.title;
        document.getElementById('video-area').style.display = 'none';
        const list = document.getElementById('modal-list');
        list.style.display = 'block';
        list.innerHTML = '';

        const lastIdx = progress[c.title] ?? -1;
        c.episodes.forEach((ep, eIdx) => {
            const row = document.createElement('div');
            row.className = "episode-row" + (eIdx === lastIdx ? " current" : (eIdx < lastIdx ? " seen" : ""));
            row.innerHTML = `<span>${ep.n}</span> <span class="seen-icon">${eIdx === lastIdx ? "👁️" : (eIdx < lastIdx ? "✔" : "")}</span>`;
            row.onclick = () => playVideo(idx, eIdx);
            list.appendChild(row);
        });
        document.getElementById('modal-episodes').style.display = 'flex';
    }

function playVideo(idx, eIdx) {
    const c = cartoons[idx];
    const ep = c.episodes[eIdx];
    
    // Sauvegarde la progression
    progress[c.title] = eIdx;
    localStorage.setItem('louna_tv_progress', JSON.stringify(progress));

    document.getElementById('modal-list').style.display = 'none';
    document.getElementById('video-area').style.display = 'block';
    
    // On affiche le lecteur
    const player = document.getElementById('video-player');
    const fallback = document.getElementById('youtube-fallback');
    const externalBtn = document.getElementById('external-link-btn');
    
    player.src = `https://www.youtube.com/embed/${ep.id}?autoplay=1`;
    
    // On prépare le bouton de secours au cas où l'intégration est bloquée
    // (Certaines chaînes comme Didou bloquent l'iframe, on affiche donc toujours le bouton de secours par-dessus au bout de 2 secondes pour aider)
    fallback.style.display = "flex"; 
    externalBtn.onclick = () => {
        window.open(`https://www.youtube.com/watch?v=${ep.id}`, "_blank");
    };

    // Gestion du bouton Suivant
    const nextCont = document.getElementById('next-btn-container');
    nextCont.innerHTML = '';
    if (eIdx < c.episodes.length - 1) {
        const b = document.createElement('button');
        b.className = 'btn-control';
        b.innerText = "Suivant ➡";
        b.onclick = () => playVideo(idx, eIdx + 1);
        nextCont.appendChild(b);
    }
    
    render(); // Pour mettre à jour les badges de progression en arrière-plan
}

    function stopVideo() {
        document.getElementById('video-player').src = '';
        document.getElementById('video-area').style.display = 'none';
        document.getElementById('modal-list').style.display = 'block';
    }

    function closeModal() {
        document.getElementById('modal-episodes').style.display = 'none';
        stopVideo();
    }

    function openLoliRockFranceTV() {
        window.open("https://www.france.tv/france-3/lolirock/", "_blank");
    }

    function toggleFullscreen() {
        const w = document.getElementById("video-wrapper");
        if (!document.fullscreenElement) w.requestFullscreen?.(); else document.exitFullscreen?.();
    }

    function searchCartoon() {
        const val = document.getElementById('searchBar').value.toLowerCase();
        const res = cartoons.filter(c => c.title.toLowerCase().includes(val));
        const sAll = document.getElementById('scroll-all');
        sAll.innerHTML = '';
        res.forEach(c => sAll.innerHTML += `<img class="row__poster" src="${c.img}" onclick="openModal(${cartoons.indexOf(c)})">`);
    }
    // --- RECHERCHE & EASTER EGGS ---
function searchCartoon() {
    const val = document.getElementById('searchBar').value.toLowerCase();
    const msg = document.getElementById('christmas-msg');
    
    // On arrête la pluie précédente et on cache le message
    stopRain(); 
    msg.style.display = 'none';

    // Déclenchement des secrets
    if (val === 'amour') {
        startRain('❤️');
    } else if (val === 'flocon') {
        startRain('❄️');
    } else if (val === 'noël') {
        msg.style.display = 'block';
        startRain('🎁');
    }

    // Filtrage des dessins animés
    const filtered = cartoons.filter(c => c.title.toLowerCase().includes(val));
    const scrollAll = document.getElementById('scroll-all');
    scrollAll.innerHTML = '';
    
    filtered.forEach(c => {
        const originalIdx = cartoons.findIndex(item => item.title === c.title);
        const card = `<div class="poster-container">
            <div class="fav-badge ${favs.includes(c.title)?'active':''}" onclick="toggleFav('${c.title}')">❤</div>
            <img class="row__poster" src="${c.img}" onclick="openModal(${originalIdx})">
        </div>`;
        scrollAll.innerHTML += card;
    });
}

// Fonctions pour la pluie d'objets
function startRain(symbol) {
    if (rainInterval) clearInterval(rainInterval);
    rainInterval = setInterval(() => {
        const item = document.createElement('div');
        item.className = 'falling-item';
        item.innerText = symbol;
        item.style.left = Math.random() * 100 + 'vw';
        item.style.fontSize = (Math.random() * 20 + 20) + 'px';
        item.style.animationDuration = (Math.random() * 3 + 2) + 's';
        document.body.appendChild(item);
        
        // Supprime l'élément après l'animation pour ne pas ralentir le téléphone
        setTimeout(() => item.remove(), 5000);
    }, 200);
}

function stopRain() {
    if (rainInterval) {
        clearInterval(rainInterval);
        rainInterval = null;
    }
}

// Fonction pour le message de fin (à appeler quand elle finit une série)
function showFinishMessage() {
    stopVideo();
    closeModal();
    const msg = document.getElementById('finish-msg');
    msg.style.display = 'block';
    startRain('🎉');
    setTimeout(() => {
        msg.style.display = 'none';
        stopRain();
    }, 6000);
}
function infoHero() {
    startRain('✨');
    setTimeout(() => stopRain(), 6000);
    alert("C'est une sélection spéciale pour toi, Louna ! ❤️");
}
